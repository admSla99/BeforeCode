name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Storage tests shell out to the system git binary.
      - run: git --version
      - run: go build ./...
      # The SQLite driver is pure Go; the binary must build without a C toolchain.
      - run: go build ./...
        env:
          CGO_ENABLED: "0"
      - run: go test -race ./...

  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: git --version
      - run: go build ./...
      # No -race: it needs cgo. Tests that need a POSIX shell skip themselves.
      # Starting git is slow on Windows; the tests run in parallel and share
      # their setup (#72) to stay well under the default timeout.
      - run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
